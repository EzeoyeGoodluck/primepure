<input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<div class="form-row">
  <div class="field"><label for="q-name">Full Name *</label><input id="q-name" name="Full Name" autocomplete="name" placeholder="e.g. Sarah Jenkins" required></div>
  <div class="field"><label for="q-phone">Phone Number *</label><input id="q-phone" name="Phone Number" type="tel" autocomplete="tel" placeholder="e.g. 07123 456789" required></div>
</div>
<div class="form-row">
  <div class="field"><label for="q-email">Email Address *</label><input id="q-email" name="Email Address" type="email" autocomplete="email" placeholder="sarah@example.co.uk" required></div>
  <div class="field"><label for="q-postcode">Postcode / Area</label><input id="q-postcode" name="Postcode / Area" autocomplete="postal-code" placeholder="e.g. WS1 3NL or Walsall"></div>
</div>
<div class="form-row">
  <div class="field"><label for="q-service">Service Needed</label><select id="q-service" name="Service">{{serviceOptions}}</select></div>
  <div class="field"><label for="q-size">Property Size</label><select id="q-size" name="Property Size"><option>1 Bed Flat / Apartment</option><option selected>2–3 Bed House</option><option>4+ Bed Large Family Home</option><option>Commercial Office / Workplace</option><option>Single Room / Carpet Only</option></select></div>
</div>
<div class="field"><label for="q-notes">Any specific requirements or condition notes? (Optional)</label><textarea id="q-notes" name="Notes" placeholder="e.g. Under-bed clearance, carpet stain removal, or tenancy move-out..."></textarea></div>
